<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upgrade Freight & Profit</title>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .wrap {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      max-width: 460px;
      width: 100%;
    }
    h2 { margin: 0 0 6px; font-size: 20px; color: #facc15; }
    p.sub { margin: 0 0 16px; font-size: 13px; color: #cbd5e1; line-height: 1.45; }
    label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 14px;
      margin-bottom: 14px;
    }
    .plan-btn {
      width: 100%;
      padding: 13px 16px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .plan-btn.gold {
      background: #facc15;
      color: #0f172a;
      border-color: #facc15;
    }
    #msg { margin-top: 12px; font-size: 13px; color: #4ade80; text-align: center; }
    .legal {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #334155;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }
    .legal a { color: #facc15; text-decoration: none; margin: 0 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Upgrade Freight &amp; Profit</h2>
    <p class="sub">Confirm your account email and ID below, then choose your plan to complete checkout.</p>

    <label for="emailInput">App Account Email (Required)</label>
    <input id="emailInput" type="email" placeholder="you@example.com" required />

    <label for="uidInput">App Account ID / UID</label>
    <input id="uidInput" type="text" placeholder="Account ID" />

    <button class="plan-btn gold" onclick="startCheckout('pri_01m84ss69zrk713341jf6eb795')">
      <span>Solo Business / Pro · Monthly</span><span>$19 / mo</span>
    </button>
    <button class="plan-btn gold" onclick="startCheckout('pri_01m84saq5d9jv8q51e1pexn5r9')">
      <span>Solo Business / Pro · Lifetime</span><span>$199 once</span>
    </button>
    <button class="plan-btn" onclick="startCheckout('pri_01m847x8y1btzy1zacptnv1jn2')">
      <span>Enterprise / Team · Monthly</span><span>$39 / mo</span>
    </button>
    <button class="plan-btn" onclick="startCheckout('pri_01m847akfzp4rnkm1m1pgbnkw4')">
      <span>Enterprise / Team · Lifetime</span><span>$349 once</span>
    </button>

    <div id="msg"></div>

    <div class="legal">
      <a href="https://www.freightandprofit.com/terms-of-service" target="_blank">Terms of Service</a> ·
      <a href="https://www.freightandprofit.com/privacy-policy" target="_blank">Privacy Policy</a> ·
      <a href="https://www.freightandprofit.com/refund-policy" target="_blank">Refund Policy</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('email')) document.getElementById('emailInput').value = params.get('email');
    if (params.get('uid')) document.getElementById('uidInput').value = params.get('uid');

    Paddle.Initialize({
      token: 'live_6d1c9d033eb61a3a642d45e31d3',
      eventCallback: function(data) {
        if (data.name === 'checkout.completed') {
          document.getElementById('msg').textContent = 'Payment confirmed! Return to the Freight & Profit app and tap Refresh Account Status.';
        }
      }
    });

    function startCheckout(priceId) {
      const email = document.getElementById('emailInput').value.trim();
      const uid = document.getElementById('uidInput').value.trim();
      if (!email) {
        alert('Please enter the email address registered on your Freight & Profit account first.');
        return;
      }
      const options = {
        items: [{ priceId: priceId, quantity: 1 }],
        customer: { email: email },
        settings: {
          displayMode: 'overlay',
          theme: 'dark',
          locale: 'en'
        }
      };
      if (uid) {
        options.customData = { userId: uid };
      }
      Paddle.Checkout.open(options);
    }
  </script>
</body>
</html>
